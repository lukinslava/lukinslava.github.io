<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=1000" />
    <title>Notch Duck — cover loop</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Antonio"; src: url("assets/fonts/antonio.woff2") format("woff2"); font-weight: 400; }

      :root {
        --notch: #0b0b0b;
        --paper: #fbfaf8;
        --folder: #58b7ec;
        --folder-hi: #74c6f2;
        --wait: #e06f4f;
        --ok: #3fe269;
        --label: #0b0b0b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1600px; height: 1000px; overflow: hidden; background: #ee9f6c; }

      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #stage { position: absolute; inset: 0; overflow: hidden;
               background: linear-gradient(125deg, #f9d9a0 0%, #f4b77c 35%, #ee9f6c 52%, #b07a92 75%, #7d62a0 100%); }

      /* the notch: one black shape that opens into the panel and closes again */
      #notch { position: absolute; left: 50%; top: 0; translate: -50% 0; width: 384px; height: 58px; border-radius: 0 0 29px 29px; background: var(--notch); overflow: hidden; }
      #strip { position: absolute; left: 0; top: 0; width: 3456px; height: 576px; display: flex; opacity: 0; }
      #strip img { width: 1152px; height: 576px; display: block; flex: none; clip-path: inset(0 round 0 0 56px 56px); }
      #dot { position: absolute; left: 991px; top: 20px; width: 18px; height: 18px; border-radius: 50%; background: var(--wait); opacity: 0; }

      /* the duck: a small avatar riding the notch's right edge */
      #avatar { position: absolute; left: 1006px; top: 6px; width: 92px; height: 92px; }
      #avatarFace { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #fff; box-shadow: 0 0 0 6px var(--notch), 0 10px 22px rgba(0, 0, 0, 0.25); }
      #avatarFace img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #proud { opacity: 0; }

      /* desktop files and the dated folder they end up in */
      .file { position: absolute; width: 66px; height: 82px; background: var(--paper); border-radius: 6px; box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15); clip-path: polygon(0 0, 72% 0, 100% 22%, 100% 100%, 0 100%); }
      #folderWrap { position: absolute; left: 1376px; top: 800px; width: 112px; height: 86px; opacity: 0; }
      #folder { position: relative; width: 100%; height: 100%; background: var(--folder); border-radius: 10px; box-shadow: inset 0 18px 0 var(--folder-hi), 0 6px 16px rgba(0, 0, 0, 0.18); }
      #folderTab { position: absolute; left: 0; top: -12px; width: 48px; height: 18px; background: var(--folder); border-radius: 8px 8px 0 0; }

      /* feature labels, bottom-left, the same place as in the app's own reel */
      #labels { position: absolute; left: 80px; bottom: 44px; width: 1100px; height: 210px; overflow: hidden; }
      .label { position: absolute; left: 0; bottom: 32px; font-family: "Antonio", sans-serif; font-size: 144px; line-height: 1.05; letter-spacing: -0.02em; color: var(--label); white-space: nowrap; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.5" data-fps="30" data-width="1600" data-height="1000">
      <section id="stage" class="clip" data-start="0" data-duration="7.5" data-track-index="0" data-layout-allow-overflow="true">
        <div class="file" id="f1" style="left: 72px; top: 150px"></div>
        <div class="file" id="f2" style="left: 112px; top: 300px"></div>
        <div class="file" id="f3" style="left: 60px; top: 450px"></div>
        <div class="file" id="f4" style="left: 1430px; top: 170px"></div>
        <div class="file" id="f5" style="left: 1470px; top: 330px"></div>
        <div class="file" id="f6" style="left: 1260px; top: 640px"></div>
        <div class="file" id="f7" style="left: 1420px; top: 560px"></div>
        <div class="file" id="f8" style="left: 1130px; top: 790px"></div>
        <div class="file" id="f9" style="left: 960px; top: 680px"></div>

        <div id="folderWrap"><div id="folder"><div id="folderTab"></div></div></div>

        <div id="notch">
          <div id="strip">
            <img src="assets/panel-clipboard.jpg" alt="" />
            <img src="assets/panel-screenshots.jpg" alt="" />
            <img src="assets/panel-links.jpg" alt="" />
          </div>
        </div>
        <div id="dot"></div>

        <div id="avatar">
          <div id="avatarFace">
            <img id="calm" src="assets/duck-avatar.jpg" alt="" />
            <img id="proud" src="assets/duck-proud.jpg" alt="" />
          </div>
        </div>

        <div id="labels" data-layout-allow-overlap="true">
          <div class="label" data-layout-allow-overlap="true" id="l1">Clipboard</div>
          <div class="label" data-layout-allow-overlap="true" id="l2">Screenshots</div>
          <div class="label" data-layout-allow-overlap="true" id="l3">Links</div>
          <div class="label" data-layout-allow-overlap="true" id="l4">Tidy desktop</div>
          <div class="label" data-layout-allow-overlap="true" id="l5">Claude is waiting</div>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // geometry (canvas px): the avatar sits 14px right of the notch's right edge
      const PILL_W = 384, PANEL_W = 1152, PANEL_H = 576, CLAUDE_W = 480;
      const AVATAR_AT = (w) => w / 2 - PILL_W / 2; // x offset from the pill position
      const FOLDER = { x: 1432, y: 843 };

      // a label leaves upward while the next one rises in
      const swapLabel = (from, to, at) => {
        if (from) tl.to(from, { yPercent: -110, opacity: 0, duration: 0.2, ease: "power2.in" }, at);
        tl.fromTo(to, { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, at + (from ? 0.17 : 0));
      };
      // the duck hops whenever something changes
      const hop = (at, height = 16) => {
        tl.to("#avatarFace", { y: -height, duration: 0.14, ease: "power2.out" }, at);
        tl.to("#avatarFace", { y: 0, duration: 0.32, ease: "bounce.out" }, at + 0.14);
      };

      // Clipboard — the notch opens into the panel
      tl.fromTo("#notch", { width: PILL_W, height: 58, borderRadius: "0px 0px 29px 29px" },
        { width: PANEL_W, height: PANEL_H, borderRadius: "0px 0px 56px 56px", duration: 0.55, ease: "expo.out" }, 0.15);
      tl.fromTo("#strip", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0.25);
      tl.fromTo("#avatar", { x: 0 }, { x: AVATAR_AT(PANEL_W), duration: 0.55, ease: "expo.out" }, 0.15);
      swapLabel(null, "#l1", 0.3);
      hop(0.62);

      // Screenshots and Links — the content slides like switching tabs
      tl.fromTo("#strip", { x: 0 }, { x: -PANEL_W, duration: 0.42, ease: "power3.inOut", immediateRender: false }, 1.65);
      swapLabel("#l1", "#l2", 1.65);
      hop(1.95, 12);
      tl.to("#strip", { x: -2 * PANEL_W, duration: 0.42, ease: "power3.inOut" }, 3.0);
      swapLabel("#l2", "#l3", 3.0);
      hop(3.3, 12);

      // Tidy desktop — the panel folds back, files fly into a dated folder
      tl.to("#strip", { opacity: 0, duration: 0.18, ease: "power1.in" }, 4.3);
      tl.to("#notch", { width: PILL_W, height: 58, borderRadius: "0px 0px 29px 29px", duration: 0.45, ease: "power3.inOut" }, 4.32);
      tl.to("#avatar", { x: 0, duration: 0.45, ease: "power3.inOut" }, 4.32);
      swapLabel("#l3", "#l4", 4.35);
      tl.fromTo("#folderWrap", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 4.45);
      const files = ["#f1", "#f2", "#f3", "#f4", "#f5", "#f6", "#f7", "#f8", "#f9"];
      files.forEach((id, i) => {
        const el = document.querySelector(id);
        const dx = FOLDER.x - (el.offsetLeft + 33), dy = FOLDER.y - (el.offsetTop + 41);
        const at = 4.6 + i * 0.06;
        // an arc: x eases out, y eases in
        tl.fromTo(el, { x: 0 }, { x: dx, duration: 0.5, ease: "power1.out" }, at);
        tl.fromTo(el, { y: 0 }, { y: dy, duration: 0.5, ease: "power2.in" }, at);
        tl.fromTo(el, { scale: 1, rotation: 0, opacity: 1 }, { scale: 0.35, rotation: i % 2 ? 18 : -18, opacity: 0, duration: 0.5, ease: "power1.in" }, at);
      });
      tl.to("#folder", { scaleY: 0.88, scaleX: 1.06, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 5, transformOrigin: "50% 100%" }, 5.1);
      tl.to("#proud", { opacity: 1, duration: 0.15, ease: "none" }, 5.4);
      hop(5.4, 22);
      tl.to("#proud", { opacity: 0, duration: 0.2, ease: "none" }, 6.0);

      // Claude is waiting — a dot on the notch, orange twice, then green
      tl.to("#notch", { width: CLAUDE_W, duration: 0.3, ease: "power2.out" }, 5.95);
      tl.to("#avatar", { x: AVATAR_AT(CLAUDE_W), duration: 0.3, ease: "power2.out" }, 5.95);
      swapLabel("#l4", "#l5", 5.95);
      tl.fromTo("#dot", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(3)" }, 6.15);
      tl.to("#dot", { scale: 1.35, duration: 0.15, ease: "sine.out", yoyo: true, repeat: 3 }, 6.45);
      tl.to("#dot", { backgroundColor: "#3fe269", duration: 0.12, ease: "none" }, 7.0);
      hop(7.0, 10);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
