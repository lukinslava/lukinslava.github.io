<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awards icons — crayon, jelly, Braun</title>
<link rel="stylesheet" href="http://localhost:4000/assets/inject/awards-radial.css">
<style>
  @font-face { font-family: "Antonio"; src: url("antonio-latin.woff2") format("woff2"); font-display: swap; }
  :root { --bg: #f5f5f5; --orange: rgb(249, 112, 41); --muted: rgba(0, 0, 0, 0.5); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #000; }

  .bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 24px; background: rgba(245,245,245,.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,.08); }
  .bar strong { margin-right: auto; font-size: 15px; }
  .bar button { font: inherit; font-size: 14px; border: 0; border-radius: 999px; padding: 8px 16px; background: #000; color: #fff; cursor: pointer; }
  .bar button.ghost { background: #fff; color: #000; }

  .variant { max-width: 1440px; margin: 0 auto; padding: 56px 0 24px; }
  .variant:last-of-type { padding-bottom: 120px; }
  .variant-title { display: flex; align-items: baseline; gap: 12px; margin: 0 24px 20px; }
  .variant-title b { font-family: "Antonio", sans-serif; font-weight: 400; font-size: 44px; line-height: 1; }
  .variant-title span { color: var(--muted); font-size: 18px; }

  /* Replica of the site's Experience block at 1440px */
  .experience { position: relative; background: var(--orange); border-radius: 64px; padding: 64px 0; }
  .experience h2 { margin: 0 0 32px; text-align: center; color: #fff; font-family: "Antonio", sans-serif; font-weight: 400; font-size: 64px; line-height: 1.2; letter-spacing: -0.04em; }
  .cards { display: flex; justify-content: center; gap: 10px; padding: 0 24px; overflow-x: auto; }
  .card { flex: 0 0 380px; height: 268px; background: #fff; border-radius: 32px; padding: 32px; display: flex; flex-direction: column; }
  .card .name { margin: 0 0 16px; font-size: 28px; line-height: 1.1; letter-spacing: -0.04em; }
  .card .role { margin: 0; font-size: 24px; line-height: 1; letter-spacing: -0.01em; }
  .card .desc { margin: 4px 0 0; font-size: 24px; line-height: 1; color: var(--muted); }
  .card .date { margin: auto 0 0; font-size: 24px; line-height: 1; color: var(--muted); }
  .footer { margin: 32px 0 0; text-align: center; font-size: 24px; line-height: 1; color: var(--muted); }
  .footer span { color: #fff; }

  /* Variant C: the Experience block as a light Braun device body */
  .experience--braun {
    background: linear-gradient(180deg, #f1f1ee 0%, #e9e9e5 100%);
    box-shadow: inset 0 1.5px 0 #ffffff, inset 0 -2px 0 rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06), 0 30px 60px -30px rgba(0, 0, 0, 0.25);
  }
  .experience--braun h2 { color: #1b1b1a; }
  .experience--braun .card { box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.05), 0 2px 6px -2px rgba(0, 0, 0, 0.08); }
  .experience--braun .footer span { color: var(--orange); }

  @media (max-width: 809.98px) {
    .variant { padding-top: 40px; }
    .variant-title b { font-size: 34px; }
    .variant-title span { font-size: 15px; }
    .experience { border-radius: 40px; padding: 48px 0; }
    .experience h2 { font-size: 48px; margin-bottom: 24px; }
    .cards { justify-content: flex-start; padding: 0 16px; scroll-snap-type: x mandatory; }
    .card { flex-basis: 85%; height: 230px; padding: 24px; scroll-snap-align: center; }
    .card .name { font-size: 24px; margin-bottom: 12px; }
    .card .role, .card .desc, .card .date { font-size: 18px; }
    .footer { font-size: 18px; margin-top: 24px; }
  }
</style>
</head>
<body>

<div class="bar">
  <strong>Awards icons — crayon, jelly, Braun</strong>
  <button type="button" id="open">Open all</button>
  <button type="button" id="close" class="ghost">Close all</button>
</div>

<section class="variant">
  <div class="variant-title"><b>A · Crayon</b><span>pastel crayon drawings</span></div>
  <div class="experience" id="block-crayon"></div>
</section>

<section class="variant">
  <div class="variant-title"><b>B · Jelly</b><span>glossy rubber toys</span></div>
  <div class="experience" id="block-jelly"></div>
</section>

<section class="variant">
  <div class="variant-title"><b>C · Braun</b><span>no orange background, physical orange button, LCD labels</span></div>
  <div class="experience experience--braun" id="block-braun"></div>
</section>

<section class="variant">
  <div class="variant-title"><b>C2 · Braun flat button</b><span>solid orange, darker bottom edge instead of a gradient</span></div>
  <div class="experience experience--braun" id="block-braun-flat"></div>
</section>

<template id="experience-content">
  <h2>Experience</h2>
  <div class="cards">
    <div class="card"><p class="name">Pragmatica</p><p class="role">Outstaff Design Lead</p><p class="desc">Matching and growing<br>designers of all profiles<br>for big tech and startups</p><p class="date">Dec 2025 — still working</p></div>
    <div class="card"><p class="name">Looch</p><p class="role">Product Design Lead</p><p class="desc">Product studio — #1 UX<br>and research in Russia</p><p class="date">Nov 2023 — Oct 2025</p></div>
    <div class="card"><p class="name">Ring Central</p><p class="role">Senior Product Designer</p><p class="desc">#1 global UCaaS<br>and CCaaS solution</p><p class="date">Dec 2021 — July 2023</p></div>
  </div>
  <p class="footer">and other from <span>Feb 2018</span></p>
</template>

<script>window.AW_MANUAL = true;</script>
<script src="http://localhost:4000/assets/inject/awards-radial.js"></script>
<script>
  const tpl = document.getElementById("experience-content");
  const blocks = { crayon: document.getElementById("block-crayon"), jelly: document.getElementById("block-jelly"), braun: document.getElementById("block-braun") };
  for (const b of Object.values(blocks)) b.appendChild(tpl.content.cloneNode(true));

  const instances = Object.entries(blocks).map(([style, el]) => window.AwardsRadial.mount(() => el, style));
  const flatBlock = document.getElementById("block-braun-flat");
  flatBlock.appendChild(tpl.content.cloneNode(true));
  instances.push(window.AwardsRadial.mount(() => flatBlock, "braun", { button: "flat" }));
  const setAll = (open) => instances.forEach((i) => i.setOpen(open));
  document.getElementById("open").addEventListener("click", (e) => { e.stopPropagation(); setAll(true); });
  document.getElementById("close").addEventListener("click", () => setAll(false));
  // Open all a moment after load so the icons are visible right away
  setTimeout(() => setAll(true), 700);
</script>
</body>
</html>
