<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=900" />
    <title>Autodraw — cover loop</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Antonio"; src: url("assets/fonts/antonio.woff2") format("woff2"); font-weight: 400; }

      /* the board colour of the case's own interaction recording, so the clip sits on it without an edge */
      :root { --board: #fbfbfb; --ink: #111110; --muted: #5f5e59; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1600px; height: 900px; overflow: hidden; background: var(--board); }

      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--board); }
      #stage { position: absolute; inset: 0; overflow: hidden; background: transparent; color: var(--ink); font-family: "Antonio", sans-serif; }

      /* the real prototype from the case: a sketched eye, the Keep / Off menu, the clean two-tone icon */
      #demo { position: absolute; left: -110px; top: 30px; width: 1700px; height: 955px; object-fit: cover; }

      #title { position: absolute; left: 80px; top: 64px; font-size: 96px; line-height: 1; letter-spacing: -0.02em; }
      #sub { position: absolute; left: 80px; top: 176px; font-size: 40px; line-height: 1; color: var(--muted); }
      #money { position: absolute; left: 80px; top: 704px; font-size: 96px; line-height: 1; letter-spacing: -0.02em; opacity: 0; }
      #moneySub { position: absolute; left: 80px; top: 816px; font-size: 40px; line-height: 1; color: var(--muted); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-fps="30" data-width="1600" data-height="900">
      <video id="demo" class="clip" data-start="0" data-duration="8" data-track-index="1" src="assets/autodraw-demo.mp4" muted playsinline></video>
      <section id="stage" class="clip" data-start="0" data-duration="8" data-track-index="0" data-layout-allow-overflow="true">
        <div id="title">Autodraw</div>
        <div id="sub">AI shape recognition</div>
        <div id="money">~$700K</div>
        <div id="moneySub">projected revenue</div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // the recording fades in and out on the board, so the loop has no jump cut
      tl.fromTo("#demo", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
      // the result lands as the sketch turns into the clean icon (≈5 s into the recording)
      tl.fromTo(["#money", "#moneySub"], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out", stagger: 0.08 }, 5.1);
      tl.to(["#demo", "#money", "#moneySub"], { opacity: 0, duration: 0.4, ease: "power1.in" }, 7.6);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
