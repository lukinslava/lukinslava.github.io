<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cases layout — 10 variants</title>
<style>
  @font-face { font-family: "Antonio"; src: url("../experience-type/antonio-latin.woff2") format("woff2"); font-display: swap; }
  :root {
    --bg: #f5f5f5; --card: #fff; --ink: #1b1b1a; --text: #2f2f2d; --label: #85847f; --line: rgba(0,0,0,.08);
    --orange: #f97029; --orange-edge: #cf5412;
    --radius: 32px;
    --hairline: 0 0 0 1px rgba(0,0,0,.05), 0 2px 6px -2px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }

  /* ---------- page chrome ---------- */
  .intro { max-width: 1291px; margin: 0 auto; padding: 64px 24px 8px; }
  .intro h1 { font: 400 64px/1.1 "Antonio", sans-serif; letter-spacing: -0.04em; margin: 0 0 12px; }
  .intro p { margin: 0; font-size: 20px; line-height: 1.3; color: var(--label); max-width: 760px; }
  .toc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
  .toc a { padding: 8px 14px; border-radius: 999px; background: #fff; box-shadow: var(--hairline); font-size: 14px; color: var(--text); }
  .toc a:hover { color: var(--orange); }

  .variant { max-width: 1291px; margin: 0 auto; padding: 72px 24px 24px; }
  .v-head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; padding-bottom: 20px; margin-bottom: 40px; border-bottom: 1px solid var(--line); }
  .v-head b { font: 400 44px/1 "Antonio", sans-serif; letter-spacing: -0.02em; }
  .v-head span { font-size: 16px; color: var(--label); }
  .v-head em { font-style: normal; font-size: 14px; color: var(--label); margin-left: auto; }
  .v-head em i { font-style: normal; color: var(--text); }
  .group { font: 400 40px/1.1 "Antonio", sans-serif; letter-spacing: -0.03em; margin: 0 0 20px; }
  .group + * { margin-bottom: 48px; }
  .group.center { text-align: center; }

  .t-title { font-size: 20px; line-height: 1.2; letter-spacing: -0.01em; color: var(--ink); }
  .t-label { font-size: 16px; line-height: 1.3; color: var(--label); }
  .t-tag { font-size: 13px; line-height: 1; color: var(--label); text-transform: lowercase; }

  /* Braun buttons (same as the awards tuner) */
  .bb { --edge: 3px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--orange); color: #fff; cursor: pointer;
        box-shadow: inset 0 calc(var(--edge) * -1) 0 var(--orange-edge), 0 4px 10px -4px rgba(207,84,18,.6);
        display: grid; place-items: center; transition: transform .08s, box-shadow .08s; }
  .bb:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 var(--orange-edge), 0 2px 4px -2px rgba(207,84,18,.6); }
  .bb svg { width: 18px; height: 18px; }
  .bb:disabled { opacity: .35; cursor: default; }
  .arrow { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--bg); color: var(--ink); transition: background .2s, color .2s, transform .2s; flex: none; }
  .arrow svg { width: 16px; height: 16px; }

  /* ============ A · compact grid ============ */
  .a-cases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .a-side { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .a-card { background: var(--card); border-radius: 24px; box-shadow: var(--hairline); overflow: hidden; display: flex; flex-direction: column; transition: transform .25s, box-shadow .25s; }
  .a-card .cover { aspect-ratio: 16 / 10; overflow: hidden; margin: 8px 8px 0; border-radius: 18px; }
  .a-card .cover img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
  .a-card .body { padding: 16px 20px 20px; display: grid; gap: 6px; }
  .a-card:hover { transform: translateY(-4px); box-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 20px 40px -20px rgba(0,0,0,.25); }
  .a-card:hover .cover img { transform: scale(1.04); }
  .a-side .t-title { font-size: 18px; }
  .a-side .t-label { font-size: 14px; }

  /* ============ B · bento ============ */
  .b-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 260px 260px; gap: 16px; }
  .b-tile { position: relative; border-radius: 28px; overflow: hidden; background: #ddd; box-shadow: var(--hairline); }
  .b-tile img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
  .b-tile .cap { position: absolute; left: 12px; right: 12px; bottom: 12px; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); border-radius: 18px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; transform: translateY(0); transition: transform .3s; }
  .b-tile .cap div { display: grid; gap: 4px; min-width: 0; }
  .b-tile .cap .t-label { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .b-tile:hover img { transform: scale(1.05); }
  .b-tile:hover .arrow { background: var(--orange); color: #fff; }
  .b-big { grid-row: span 2; }
  .b-big .t-title { font-size: 24px; }
  .b-big .cap .t-label { white-space: normal; }
  .b-wide { grid-column: span 2; }
  .b-side { grid-template-columns: repeat(4, 1fr); grid-template-rows: 220px; }

  /* ============ C · hover-preview list ============ */
  .c-list { position: relative; border-top: 1px solid var(--line); }
  .c-row { display: grid; grid-template-columns: 56px 1.4fr 1fr 44px; gap: 24px; align-items: center; padding: 26px 8px; border-bottom: 1px solid var(--line); transition: padding .3s, color .3s; }
  .c-row .num { font: 400 20px/1 "Antonio", sans-serif; color: var(--label); }
  .c-row .t-title { font-size: 28px; letter-spacing: -0.03em; transition: color .25s; }
  .c-row .t-label { transition: color .25s; }
  .c-row:hover { padding-left: 24px; }
  .c-row:hover .t-title, .c-row:hover .num { color: var(--orange); }
  .c-row:hover .arrow { background: var(--orange); color: #fff; transform: rotate(-45deg); }
  .c-float { position: fixed; left: 0; top: 0; width: 320px; aspect-ratio: 16/10; border-radius: 20px; overflow: hidden; pointer-events: none; z-index: 50;
             box-shadow: 0 30px 60px -20px rgba(0,0,0,.35); opacity: 0; transform: translate(-50%, -50%) scale(.6) rotate(-4deg); transition: opacity .25s, transform .35s cubic-bezier(.2,.8,.2,1); }
  .c-float.on { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-4deg); }
  .c-float img { width: 100%; height: 100%; object-fit: cover; }

  /* ============ D · index table ============ */
  .d-table { background: var(--card); border-radius: var(--radius); box-shadow: var(--hairline); padding: 8px 24px; }
  .d-head, .d-row { display: grid; grid-template-columns: 120px 1.3fr 1fr 140px 36px; gap: 24px; align-items: center; }
  .d-head { padding: 16px 0 12px; border-bottom: 1px solid var(--line); }
  .d-head span { font-size: 13px; color: var(--label); text-transform: lowercase; }
  .d-row { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .d-row:last-child { border-bottom: 0; }
  .d-row .thumb { width: 120px; aspect-ratio: 16/10; border-radius: 12px; overflow: hidden; }
  .d-row .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
  .d-row .t-label { font-size: 15px; }
  .d-row:hover .thumb img { transform: scale(1.08); }
  .d-row:hover .arrow { background: var(--orange); color: #fff; }
  .d-sep td, .d-sep { grid-column: 1 / -1; padding: 22px 0 8px; font: 400 24px/1 "Antonio", sans-serif; letter-spacing: -0.02em; color: var(--ink); border-bottom: 1px solid var(--line); }

  /* ============ E · scroll-snap carousel ============ */
  .e-wrap { position: relative; }
  .e-track { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding: 4px 4px 24px; scrollbar-width: none; }
  .e-track::-webkit-scrollbar { display: none; }
  .e-card { flex: 0 0 520px; scroll-snap-align: start; background: var(--card); border-radius: 28px; box-shadow: var(--hairline); overflow: hidden; }
  .e-card .cover { aspect-ratio: 4/3; margin: 8px 8px 0; border-radius: 20px; overflow: hidden; }
  .e-card .cover img { width: 100%; height: 100%; object-fit: cover; }
  .e-card .body { padding: 18px 22px 22px; display: grid; gap: 6px; }
  .e-card .t-tag { margin-bottom: 4px; }
  .e-bar { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
  .e-ticks { display: flex; gap: 6px; margin-right: auto; }
  .e-ticks i { width: 18px; height: 4px; border-radius: 2px; background: rgba(0,0,0,.12); transition: background .25s, width .25s; }
  .e-ticks i.on { background: var(--orange); width: 36px; }
  .e-count { font: 400 20px/1 "Antonio", sans-serif; color: var(--label); min-width: 48px; }

  /* ============ F · coverflow ============ */
  .f-stage { position: relative; height: 470px; perspective: 1600px; overflow: hidden; touch-action: pan-y; user-select: none; }
  .f-card { position: absolute; left: 50%; top: 10px; width: 620px; margin-left: -310px; background: var(--card); border-radius: 28px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.35), var(--hairline); overflow: hidden; transition: transform .6s cubic-bezier(.2,.8,.2,1), opacity .6s, filter .6s; cursor: pointer; }
  .f-card .cover { aspect-ratio: 16/9; overflow: hidden; }
  .f-card .cover img { width: 100%; height: 100%; object-fit: cover; }
  .f-card .body { padding: 18px 24px 22px; display: grid; gap: 6px; }
  .f-nav { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 8px; }
  .f-nav .t-label { min-width: 280px; text-align: center; }

  /* ============ G · expanding panels ============ */
  .g-row { display: flex; gap: 12px; height: 420px; }
  .g-panel { position: relative; flex: 1; min-width: 0; border-radius: 28px; overflow: hidden; transition: flex .6s cubic-bezier(.2,.8,.2,1); cursor: pointer; background: #ccc; }
  .g-panel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .g-panel .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.6)); opacity: 0; transition: opacity .4s; }
  .g-panel .vlabel { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); writing-mode: vertical-rl; rotate: 180deg; background: rgba(255,255,255,.95); padding: 14px 8px; border-radius: 999px; font-size: 14px; color: var(--ink); white-space: nowrap; transition: opacity .3s; }
  .g-panel .info { position: absolute; left: 24px; right: 24px; bottom: 22px; color: #fff; opacity: 0; transform: translateY(12px); transition: opacity .35s .1s, transform .35s .1s; }
  .g-panel .info .t-title { color: #fff; font-size: 26px; }
  .g-panel .info .t-label { color: rgba(255,255,255,.8); margin-top: 6px; }
  .g-panel.open { flex: 5; }
  .g-panel.open .shade, .g-panel.open .info { opacity: 1; transform: none; }
  .g-panel.open .vlabel { opacity: 0; }

  /* ============ H · card stack ============ */
  .h-wrap { display: grid; grid-template-columns: 1fr 1.2fr; gap: 48px; align-items: center; }
  .h-stack { position: relative; height: 420px; }
  .h-card { position: absolute; inset: 0 30px 40px 0; background: var(--card); border-radius: 28px; box-shadow: 0 20px 50px -25px rgba(0,0,0,.35), var(--hairline); overflow: hidden; transition: transform .55s cubic-bezier(.2,.8,.2,1), opacity .55s; cursor: grab; }
  .h-card .cover { height: 70%; }
  .h-card .cover img { width: 100%; height: 100%; object-fit: cover; }
  .h-card .body { padding: 18px 22px; display: grid; gap: 6px; }
  .h-side { display: grid; gap: 4px; }
  .h-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; cursor: pointer; transition: background .2s; }
  .h-item .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(0,0,0,.15); flex: none; transition: background .2s, box-shadow .2s; }
  .h-item.on { background: #fff; box-shadow: var(--hairline); }
  .h-item.on .dot { background: var(--orange); box-shadow: 0 0 0 4px rgba(249,112,41,.18); }
  .h-item .t-title { font-size: 18px; }
  .h-item .t-tag { margin-left: auto; }

  /* ============ I · marquee ============ */
  .i-marquee { overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); padding: 6px 0; }
  .i-track { display: flex; gap: 16px; width: max-content; animation: i-scroll 38s linear infinite; }
  .i-marquee.rev .i-track { animation-direction: reverse; animation-duration: 46s; }
  .i-marquee:hover .i-track { animation-play-state: paused; }
  @keyframes i-scroll { to { transform: translateX(calc(-50% - 8px)); } }
  .i-card { width: 360px; background: var(--card); border-radius: 22px; box-shadow: var(--hairline); padding: 8px; display: grid; grid-template-columns: 132px 1fr; gap: 14px; align-items: center; transition: transform .25s; }
  .i-card .thumb { aspect-ratio: 1; border-radius: 16px; overflow: hidden; }
  .i-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .i-card .body { display: grid; gap: 6px; padding-right: 8px; }
  .i-card .t-title { font-size: 17px; }
  .i-card .t-label { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .i-card:hover { transform: translateY(-3px); }
  .i-gap { height: 16px; }
  .variant .i-marquee { margin-bottom: 0; }

  /* ============ J · master–detail ============ */
  .j-wrap { display: grid; grid-template-columns: 380px 1fr; gap: 16px; background: var(--card); border-radius: var(--radius); box-shadow: var(--hairline); padding: 12px; }
  .j-list { display: grid; align-content: start; gap: 2px; padding: 8px; }
  .j-list .sub { font-size: 13px; color: var(--label); text-transform: lowercase; padding: 16px 12px 6px; }
  .j-list .sub:first-child { padding-top: 6px; }
  .j-item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px; border-radius: 14px; cursor: pointer; transition: background .2s; }
  .j-item .t-title { font-size: 17px; }
  .j-item .t-tag { align-self: center; }
  .j-item:hover { background: var(--bg); }
  .j-item.on { background: var(--bg); }
  .j-item.on .t-title { color: var(--orange); }
  .j-view { position: relative; border-radius: 22px; overflow: hidden; min-height: 460px; background: var(--bg); }
  .j-view img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .45s, transform .8s; }
  .j-view img.out { opacity: 0; transform: scale(1.04); }
  .j-view .cap { position: absolute; left: 16px; right: 16px; bottom: 16px; background: rgba(255,255,255,.95); backdrop-filter: blur(8px); border-radius: 18px; padding: 18px 20px; display: flex; gap: 16px; align-items: center; }
  .j-view .cap div { display: grid; gap: 6px; }
  .j-view .cap .t-title { font-size: 24px; }

  /* ---------- mobile ---------- */
  @media (max-width: 809.98px) {
    .intro h1 { font-size: 44px; }
    .variant { padding: 56px 16px 16px; }
    .v-head b { font-size: 34px; }
    .v-head em { margin-left: 0; width: 100%; }
    .group { font-size: 32px; }
    .a-cases, .a-side { grid-template-columns: 1fr 1fr; gap: 10px; }
    .a-cases .a-card:first-child { grid-column: span 2; }
    .a-card .body { padding: 12px 14px 16px; }
    .a-card .t-title { font-size: 16px; } .a-card .t-label { font-size: 13px; }
    .b-grid, .b-side { grid-template-columns: 1fr 1fr; grid-template-rows: auto; }
    .b-tile { aspect-ratio: 1; } .b-big, .b-wide { grid-column: span 2; grid-row: auto; aspect-ratio: 16/11; }
    .b-tile .cap { left: 8px; right: 8px; bottom: 8px; padding: 10px 12px; } .b-tile .cap .t-label, .b-tile .arrow { display: none; }
    .b-tile .t-title, .b-big .t-title { font-size: 15px; }
    .c-row { grid-template-columns: 72px 1fr 36px; gap: 14px; padding: 16px 0; }
    .c-row .num { display: none; } .c-row .t-label { grid-column: 2; font-size: 14px; }
    .c-row .t-title { font-size: 20px; }
    .c-row::before { content: ""; grid-row: span 2; width: 72px; aspect-ratio: 1; border-radius: 12px; background: var(--thumb) center / cover; }
    .c-row .arrow { grid-row: 1 / span 2; grid-column: 3; }
    .c-row:hover { padding-left: 0; }
    .d-table { padding: 4px 14px; }
    .d-head { display: none; }
    .d-row { grid-template-columns: 88px 1fr; gap: 4px 14px; }
    .d-row .thumb { width: 88px; grid-row: span 3; }
    .d-row .arrow { display: none; }
    .d-row .t-label, .d-row .t-tag { grid-column: 2; }
    .e-card { flex-basis: 82%; }
    .f-stage { height: 300px; } .f-card { width: 300px; margin-left: -150px; }
    .f-nav .t-label { min-width: 0; flex: 1; font-size: 14px; }
    .g-row { flex-direction: column; height: 640px; }
    .g-panel .vlabel { writing-mode: horizontal-tb; rotate: 0deg; left: 16px; bottom: 50%; transform: translateY(50%); }
    .h-wrap { grid-template-columns: 1fr; gap: 16px; } .h-stack { height: 360px; } .h-side { display: none; }
    .i-card { width: 290px; grid-template-columns: 96px 1fr; }
    .j-wrap { grid-template-columns: 1fr; } .j-view { min-height: 260px; order: -1; } .j-view .cap { padding: 12px 14px; } .j-view .cap .t-title { font-size: 16px; } .j-view .cap .t-label, .j-view .cap .t-tag { display: none; }
  }
</style>
</head>
<body>

<header class="intro">
  <h1>Cases — 10 layouts</h1>
  <p>Same seven projects as the site: three cases and four AI & side projects. Each variant replaces the big 1291×700 cards. Patterns come from 21st.dev, Magic UI and bencho.dev.</p>
  <nav class="toc" id="toc"></nav>
</header>

<main id="variants"></main>
<div class="c-float" id="c-float"><img alt=""></div>

<script>
const ARROW = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
const LEFT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>';
const RIGHT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>';

const CASES = [
  { id: "yandex", title: "Team Restructuring: Growing from 2 to 5 Designers", short: "Growing from 2 to 5 designers", label: "Restructured the design team in Yandex Market’s logistics project", tag: "Yandex Market", kind: "Case" },
  { id: "process", title: "The process that makes designers stronger", short: "The process that makes designers stronger", label: "How I stopped designers from being just a pair of hands", tag: "Yandex Logistics", kind: "Case" },
  { id: "mindbox", title: "From one-week planning to product thinking", short: "From one-week planning to product thinking", label: "Transforming design processes at Mindbox", tag: "Mindbox", kind: "Case" },
];
const SIDE = [
  { id: "auf", title: "AUF Match", short: "AUF Match", label: "Internal AI tool at Pragmatica: screens 2,000+ designer portfolios and shortlists 30–60 per role", tag: "AI tool", kind: "AI" },
  { id: "aleria", title: "Aleria", short: "Aleria", label: "Head of Design for several products built on proprietary AI", tag: "Side project", kind: "Side" },
  { id: "phygital", title: "Phygital+", short: "Phygital+", label: "Product designer, first-session experience for a generative AI workspace", tag: "Side project", kind: "Side" },
  { id: "autodraw", title: "Autodraw", short: "Autodraw", label: "AI shape recognition for the RingCentral whiteboard · ~$700K projected revenue", tag: "RingCentral", kind: "AI" },
];
const ALL = [...CASES, ...SIDE];
const img = (p) => `covers/${p.id}.jpg`;

const VARIANTS = [
  { key: "A", name: "Compact grid", src: "21st.dev · Grids & Bento", note: "cards shrink to a 3 + 4 grid, cover 16:10 inside the card like the Experience cards", render: renderA },
  { key: "B", name: "Bento", src: "Magic UI · Bento Grid", note: "one lead case large, the rest as tiles with a floating caption", render: renderB },
  { key: "C", name: "Hover-preview list", src: "21st.dev · Hover Preview / Cinematic List", note: "typographic rows, the cover follows the cursor; thumbnails on touch", render: renderC },
  { key: "D", name: "Index table", src: "refero styles · editorial / monochrome UI", note: "one white Braun panel with small thumbnails, company column", render: renderD },
  { key: "E", name: "Snap carousel", src: "21st.dev · Framer Carousel + bencho · Progress ticks", note: "swipeable row with orange Braun prev/next buttons and progress ticks", render: renderE },
  { key: "F", name: "Coverflow", src: "21st.dev · Coverflow / Card Fan Carousel", note: "centre card in focus, neighbours fan out; click, arrows, keys or swipe", render: renderF },
  { key: "G", name: "Expanding panels", src: "21st.dev · Hover Expand Gallery", note: "narrow strips open on hover or tap; a whole section fits in one row", render: renderG },
  { key: "H", name: "Card stack", src: "21st.dev · CardStack + bencho · Selection list", note: "a deck you flip by click or drag, with a list that jumps to any card", render: renderH },
  { key: "I", name: "Marquee", src: "Magic UI · Marquee", note: "two slow rows moving in opposite directions, pause on hover", render: renderI },
  { key: "J", name: "List + preview", src: "bencho · Selection list / master–detail", note: "all seven projects in one panel: pick on the left, preview on the right", render: renderJ },
];

function groups(sec, fn, center) {
  for (const [name, items] of [["Cases", CASES], ["AI & side projects", SIDE]]) {
    sec.insertAdjacentHTML("beforeend", `<h2 class="group${center ? " center" : ""}">${name}</h2>`);
    const el = fn(items, name); sec.append(el);
  }
}
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };

/* A */
function renderA(sec) {
  groups(sec, (items, name) => h(`<div class="${name === "Cases" ? "a-cases" : "a-side"}">${items.map((p) => `
    <a class="a-card" href="#"><div class="cover"><img src="${img(p)}" alt=""></div>
      <div class="body"><span class="t-title">${p.short}</span><span class="t-label">${p.label}</span></div></a>`).join("")}</div>`));
}

/* B */
function renderB(sec) {
  const tile = (p, cls = "") => `<a class="b-tile ${cls}" href="#"><img src="${img(p)}" alt="">
    <div class="cap"><div><span class="t-title">${p.short}</span><span class="t-label">${p.label}</span></div><span class="arrow" style="margin-left:auto">${ARROW}</span></div></a>`;
  sec.insertAdjacentHTML("beforeend", `<h2 class="group">Cases</h2>`);
  sec.append(h(`<div class="b-grid">${tile(CASES[0], "b-big")}${tile(CASES[1], "b-wide")}${tile(CASES[2], "b-wide")}</div>`));
  sec.insertAdjacentHTML("beforeend", `<h2 class="group">AI & side projects</h2>`);
  sec.append(h(`<div class="b-grid b-side">${SIDE.map((p) => tile(p)).join("")}</div>`));
}

/* C */
function renderC(sec) {
  const float = document.getElementById("c-float"), fimg = float.querySelector("img");
  groups(sec, (items) => {
    const list = h(`<div class="c-list">${items.map((p, i) => `
      <a class="c-row" href="#" data-img="${img(p)}" style="--thumb:url(${img(p)})"><span class="num">0${ALL.indexOf(p) + 1}</span>
        <span class="t-title">${p.short}</span><span class="t-label">${p.label}</span><span class="arrow">${ARROW}</span></a>`).join("")}</div>`);
    list.querySelectorAll(".c-row").forEach((row) => {
      row.addEventListener("pointerenter", (e) => { if (e.pointerType !== "mouse") return; fimg.src = row.dataset.img; float.classList.add("on"); });
      row.addEventListener("pointerleave", () => float.classList.remove("on"));
      row.addEventListener("pointermove", (e) => { float.style.left = e.clientX + 180 + "px"; float.style.top = e.clientY + "px"; });
    });
    return list;
  });
}

/* D */
function renderD(sec) {
  const row = (p) => `<a class="d-row" href="#"><div class="thumb"><img src="${img(p)}" alt=""></div>
    <span class="t-title">${p.short}</span><span class="t-label">${p.label}</span><span class="t-tag">${p.tag}</span><span class="arrow">${ARROW}</span></a>`;
  sec.append(h(`<div class="d-table">
    <div class="d-head"><span></span><span>project</span><span>what</span><span>where</span><span></span></div>
    <div class="d-sep">Cases</div>${CASES.map(row).join("")}
    <div class="d-sep">AI & side projects</div>${SIDE.map(row).join("")}</div>`));
}

/* E */
function renderE(sec) {
  const card = (p) => `<a class="e-card" href="#"><div class="cover"><img src="${img(p)}" alt=""></div>
    <div class="body"><span class="t-tag">${p.tag}</span><span class="t-title">${p.short}</span><span class="t-label">${p.label}</span></div></a>`;
  groups(sec, (items) => {
    const wrap = h(`<div class="e-wrap"><div class="e-track">${items.map(card).join("")}</div>
      <div class="e-bar"><div class="e-ticks">${items.map(() => "<i></i>").join("")}</div><span class="e-count"></span>
      <button class="bb" data-d="-1" aria-label="Previous">${LEFT}</button><button class="bb" data-d="1" aria-label="Next">${RIGHT}</button></div></div>`);
    const track = wrap.querySelector(".e-track"), ticks = [...wrap.querySelectorAll(".e-ticks i")], count = wrap.querySelector(".e-count");
    const [prev, next] = wrap.querySelectorAll(".bb");
    const step = () => track.querySelector(".e-card").offsetWidth + 16;
    const update = () => {
      const i = Math.round(track.scrollLeft / step());
      const end = track.scrollLeft + track.clientWidth >= track.scrollWidth - 4;
      const cur = end ? items.length - 1 : i;
      ticks.forEach((t, k) => t.classList.toggle("on", k === cur));
      count.textContent = `${cur + 1}/${items.length}`;
      prev.disabled = track.scrollLeft < 4; next.disabled = end;
    };
    wrap.querySelectorAll(".bb").forEach((b) => b.onclick = () => track.scrollBy({ left: step() * Number(b.dataset.d) }));
    track.addEventListener("scroll", () => requestAnimationFrame(update));
    requestAnimationFrame(update);
    return wrap;
  });
}

/* F */
function renderF(sec) {
  groups(sec, (items) => {
    const wrap = h(`<div><div class="f-stage" tabindex="0">${items.map((p) => `
      <div class="f-card"><div class="cover"><img src="${img(p)}" alt="" draggable="false"></div>
      <div class="body"><span class="t-title">${p.short}</span><span class="t-label">${p.tag}</span></div></div>`).join("")}</div>
      <div class="f-nav"><button class="bb" aria-label="Previous">${LEFT}</button><span class="t-label"></span><button class="bb" aria-label="Next">${RIGHT}</button></div></div>`);
    const cards = [...wrap.querySelectorAll(".f-card")], label = wrap.querySelector(".f-nav .t-label"), stage = wrap.querySelector(".f-stage");
    let cur = Math.floor((items.length - 1) / 2);
    const mobile = () => matchMedia("(max-width: 809.98px)").matches;
    const layout = () => {
      cards.forEach((c, i) => {
        const d = i - cur, a = Math.abs(d), sx = mobile() ? 190 : 380;
        c.style.transform = `translateX(${d * sx}px) translateZ(${-a * 160}px) rotateY(${-Math.sign(d) * Math.min(a, 1) * 28}deg) scale(${1 - Math.min(a, 2) * 0.08})`;
        c.style.zIndex = 10 - a; c.style.opacity = a > 2 ? 0 : 1; c.style.filter = a ? "saturate(.6) brightness(.96)" : "none";
      });
      label.textContent = items[cur].label;
    };
    const go = (d) => { cur = Math.max(0, Math.min(items.length - 1, cur + d)); layout(); };
    const [p, n] = wrap.querySelectorAll(".bb"); p.onclick = () => go(-1); n.onclick = () => go(1);
    cards.forEach((c, i) => c.onclick = () => { if (i !== cur) { cur = i; layout(); } });
    stage.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") go(-1); if (e.key === "ArrowRight") go(1); });
    let x0 = null; stage.addEventListener("pointerdown", (e) => x0 = e.clientX);
    stage.addEventListener("pointerup", (e) => { if (x0 !== null && Math.abs(e.clientX - x0) > 40) go(e.clientX < x0 ? 1 : -1); x0 = null; });
    addEventListener("resize", layout); layout();
    return wrap;
  });
}

/* G */
function renderG(sec) {
  groups(sec, (items) => {
    const row = h(`<div class="g-row">${items.map((p, i) => `
      <a class="g-panel${i === 0 ? " open" : ""}" href="#"><img src="${img(p)}" alt=""><div class="shade"></div>
        <span class="vlabel">${p.short}</span>
        <div class="info"><div class="t-title">${p.short}</div><div class="t-label">${p.label}</div></div></a>`).join("")}</div>`);
    const panels = [...row.children];
    const open = (el) => panels.forEach((p) => p.classList.toggle("open", p === el));
    panels.forEach((p) => {
      p.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") open(p); });
      p.addEventListener("click", (e) => { if (!p.classList.contains("open")) { e.preventDefault(); open(p); } });
    });
    return row;
  });
}

/* H */
function renderH(sec) {
  groups(sec, (items) => {
    const wrap = h(`<div class="h-wrap"><div class="h-stack">${items.map((p) => `
      <div class="h-card"><div class="cover"><img src="${img(p)}" alt="" draggable="false"></div>
      <div class="body"><span class="t-title">${p.short}</span><span class="t-label">${p.label}</span></div></div>`).join("")}</div>
      <div class="h-side">${items.map((p) => `<div class="h-item"><span class="dot"></span><span class="t-title">${p.short}</span><span class="t-tag">${p.tag}</span></div>`).join("")}
      <div style="display:flex;gap:12px;margin:16px 0 0 16px"><button class="bb" aria-label="Previous">${LEFT}</button><button class="bb" aria-label="Next">${RIGHT}</button></div></div></div>`);
    const cards = [...wrap.querySelectorAll(".h-card")], list = [...wrap.querySelectorAll(".h-item")];
    let top = 0;
    const layout = (fly = -1) => {
      cards.forEach((c, i) => {
        const d = (i - top + cards.length) % cards.length;
        c.style.zIndex = cards.length - d;
        c.style.transform = i === fly ? "translate(-40px, 30px) rotate(-10deg) scale(.9)" : `translate(${d * 14}px, ${d * 16}px) rotate(${d * 2.2}deg) scale(${1 - d * 0.04})`;
        c.style.opacity = d > 3 ? 0 : 1;
      });
      list.forEach((l, i) => l.classList.toggle("on", i === top));
    };
    const go = (d) => { const prev = top; top = (top + d + cards.length) % cards.length; layout(d > 0 ? prev : -1); setTimeout(() => layout(), 180); };
    const [p, n] = wrap.querySelectorAll(".bb"); p.onclick = () => go(-1); n.onclick = () => go(1);
    list.forEach((l, i) => l.onclick = () => { top = i; layout(); });
    let x0 = null;
    cards.forEach((c) => {
      c.addEventListener("pointerdown", (e) => { x0 = e.clientX; });
      c.addEventListener("pointerup", (e) => { if (x0 !== null) go(Math.abs(e.clientX - x0) > 30 && e.clientX > x0 ? -1 : 1); x0 = null; });
    });
    layout();
    return wrap;
  });
}

/* I */
function renderI(sec) {
  const card = (p) => `<a class="i-card" href="#"><div class="thumb"><img src="${img(p)}" alt=""></div>
    <div class="body"><span class="t-tag">${p.tag}</span><span class="t-title">${p.short}</span><span class="t-label">${p.label}</span></div></a>`;
  const row = (items, rev) => h(`<div class="i-marquee${rev ? " rev" : ""}"><div class="i-track">${[...items, ...items, ...items, ...items].map(card).join("")}</div></div>`);
  sec.insertAdjacentHTML("beforeend", `<h2 class="group center">Cases & side projects</h2>`);
  sec.append(row(CASES));
  sec.append(h('<div class="i-gap"></div>'));
  sec.append(row(SIDE, true));
}

/* J */
function renderJ(sec) {
  const item = (p) => `<div class="j-item" data-id="${p.id}"><span class="t-title">${p.short}</span><span class="t-tag">${p.tag}</span></div>`;
  const wrap = h(`<div class="j-wrap"><div class="j-list"><div class="sub">cases</div>${CASES.map(item).join("")}<div class="sub">ai & side projects</div>${SIDE.map(item).join("")}</div>
    <div class="j-view"><img alt=""><div class="cap"><div><span class="t-tag"></span><span class="t-title"></span><span class="t-label"></span></div><a class="arrow" href="#" style="margin-left:auto;background:var(--orange);color:#fff">${ARROW}</a></div></div></div>`);
  const items = [...wrap.querySelectorAll(".j-item")], view = wrap.querySelector(".j-view img");
  const [tag, title, label] = wrap.querySelectorAll(".cap .t-tag, .cap .t-title, .cap .t-label");
  const pick = (id) => {
    const p = ALL.find((x) => x.id === id);
    items.forEach((i) => i.classList.toggle("on", i.dataset.id === id));
    view.classList.add("out");
    setTimeout(() => { view.src = img(p); view.onload = () => view.classList.remove("out"); }, 180);
    tag.textContent = `${p.tag}`; title.textContent = p.title; label.textContent = p.label;
  };
  items.forEach((i) => { i.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") pick(i.dataset.id); }); i.onclick = () => pick(i.dataset.id); });
  sec.append(wrap);
  pick("yandex");
}

const main = document.getElementById("variants");
const toc = document.getElementById("toc");
for (const v of VARIANTS) {
  const sec = document.createElement("section");
  sec.className = "variant"; sec.id = "v-" + v.key.toLowerCase();
  sec.innerHTML = `<div class="v-head"><b>${v.key} · ${v.name}</b><span>${v.note}</span><em>ref: <i>${v.src}</i></em></div>`;
  main.append(sec);
  v.render(sec);
  toc.insertAdjacentHTML("beforeend", `<a href="#${sec.id}">${v.key} · ${v.name}</a>`);
}

document.querySelectorAll('a[href="#"]').forEach((a) => a.addEventListener("click", (e) => e.preventDefault()));
</script>
</body>
</html>
